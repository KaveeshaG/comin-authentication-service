# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: [dev]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/comin-authentication-service:${{ github.sha }}
      
      - name: Update Kubernetes resources
        run: |
          cd k8s/base
          sed -i "s|image: ghcr.io/${{ github.repository_owner }}/comin-authentication-service:.*|image: ghcr.io/${{ github.repository_owner }}/comin-authentication-service:${{ github.sha }}|" deployment.yml
      
      - name: Commit changes
        run: |
          git config --global user.name 'KaveeshaG'
          git config --global user.email 'uakaveeshagimhana@gmail.com'
          git add k8s/base/deployment.yml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push