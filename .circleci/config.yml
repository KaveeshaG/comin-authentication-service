version: 2.1
jobs:
  build:
    docker:
      - image: cimg/go:1.21
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Go application
          command: |
            go mod download
            # go test ./...
      - run:
          name: Login to Docker Registry
          command: |
            echo $DOCKER_PASSWORD | docker login 192.168.1.144:5000 -u $DOCKER_USERNAME --password-stdin
      - run:
          name: Configure insecure registry
          command: |
            # Create docker config to allow insecure registry
            mkdir -p ~/.docker
            echo '{"insecure-registries": ["192.168.1.144:5000"]}' > ~/.docker/config.json
      - run:
          name: Build and push Docker image
          command: |
            docker build -t 192.168.1.144:5000/comin-authentication-service:${CIRCLE_SHA1} .
            
            # Try to push with increasing timeouts
            docker push --timeout 120s 192.168.1.144:5000/comin-authentication-service:${CIRCLE_SHA1} || \
            docker push --timeout 180s 192.168.1.144:5000/comin-authentication-service:${CIRCLE_SHA1} || \
            docker push --timeout 300s 192.168.1.144:5000/comin-authentication-service:${CIRCLE_SHA1}
  deploy:
    docker:
      - image: cimg/base:2023.12
    steps:
      - checkout
      - kubernetes/install-kubectl
      - run:
          name: Setup Kubernetes config
          command: |
            echo $KUBECONFIG_DATA | base64 --decode > kubeconfig.yaml
            export KUBECONFIG=kubeconfig.yaml
      - run:
          name: Deploy to Kubernetes
          command: |
            # Create kubernetes directory if it doesn't exist
            mkdir -p k8s
            
            # Copy the deployment template files from the repo
            cp kubernetes/deployment.yaml k8s/deployment.yaml
            cp kubernetes/service.yaml k8s/service.yaml
            
            # Replace the image tag with the current commit SHA
            envsubst < k8s/deployment.yaml > k8s/deployment-with-tag.yaml
            
            # Apply the Kubernetes configurations
            kubectl apply -f k8s/deployment-with-tag.yaml
            kubectl apply -f k8s/service.yaml
            
            # Wait for the deployment to complete
            kubectl rollout status deployment/comin-authentication-service
orbs:
  kubernetes: circleci/kubernetes@1.3
workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: dev