version: 2.1
jobs:
  build:
    docker:
      - image: cimg/go:1.21
    steps:
      - checkout
      - setup_remote_docker:
          # This is important for connecting to private registries
          docker_layer_caching: true
          version: 20.10.14
      - run:
          name: Configure Docker for insecure registry
          command: |
            # Create a Docker daemon configuration file to allow insecure registry
            mkdir -p $HOME/.docker
            echo '{"insecure-registries": ["192.168.1.144:5000"]}' > $HOME/.docker/config.json
            # Restart Docker to apply settings (in CircleCI's remote Docker this is usually not needed)
      - run:
          name: Build Go application
          command: |
            go mod download
      - run:
          name: Build and push Docker image
          command: |
            # Using your existing Dockerfile
            docker build -t 192.168.1.144:5000/comin-authentication-service:${CIRCLE_SHA1} .
            
            # Increase timeout for Docker push
            docker push --timeout 120s 192.168.1.144:5000/comin-authentication-service:${CIRCLE_SHA1} || \
            docker push --timeout 180s 192.168.1.144:5000/comin-authentication-service:${CIRCLE_SHA1}

  deploy:
    docker:
      - image: cimg/base:2023.12
    steps:
      - checkout
      - kubernetes/install-kubectl
      - run:
          name: Setup Kubernetes config
          command: |
            echo $KUBECONFIG_DATA | base64 --decode > kubeconfig.yaml
            export KUBECONFIG=kubeconfig.yaml
      - run:
          name: Deploy to Kubernetes
          command: |
            # If you're using kubectl apply with files:
            envsubst < k8s/deployment.yaml > k8s/deployment-with-tag.yaml
            kubectl apply -f k8s/deployment-with-tag.yaml
            kubectl apply -f k8s/service.yaml
            
            # Or if you're updating an existing deployment:
            # kubectl set image deployment/comin-authentication-service comin-authentication-service=192.168.1.144:5000/comin-authentication-service:${CIRCLE_SHA1}
            # kubectl rollout status deployment/comin-authentication-service

orbs:
  kubernetes: circleci/kubernetes@1.3

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: dev
