version: 2.1

jobs:
  build-and-deploy:
    docker:
      - image: cimg/base:2023.03
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.14
      - run:
          name: Build and push Docker image
          command: |
            # Build and push to your registry
            docker build -t your-registry/your-image:${CIRCLE_SHA1} .
            echo $DOCKER_PWD | docker login -u $DOCKER_USER --password-stdin your-registry
            docker push your-registry/your-image:${CIRCLE_SHA1}
      - run:
          name: Install kubectl
          command: |
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
      - run:
          name: Deploy to Kubernetes
          command: |
            # Decode the base64 kubeconfig to a file
            echo $KUBECONFIG_DATA | base64 -d > kubeconfig.yaml
            export KUBECONFIG=kubeconfig.yaml
            
            # Update the deployment with the new image
            kubectl set image deployment/your-deployment your-container=your-registry/your-image:${CIRCLE_SHA1}
            
            # Verify the deployment
            kubectl rollout status deployment/your-deployment

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build-and-deploy:
          filters:
            branches:
              only: main
