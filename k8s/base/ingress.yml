apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comin-authentication-service-ingress
  namespace: comin-dev
spec:
  ingressClassName: nginx
  rules:
  - host: comin.kaveeshagimhana.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: comin-authentication-service
            port:
              number: 80